name: Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Release builds are never cancelled: a tag build is the artifact.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      # Pinned to commit SHAs rather than floating tags, so a moved tag cannot
      # change what a release build runs.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: rhYciv-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.crhy.rhYciv.yml
          cache-key: flatpak-builder-${{ runner.os }}-${{ github.sha }}
