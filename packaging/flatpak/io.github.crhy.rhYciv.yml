id: io.github.crhy.rhYciv
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
command: rhyciv

build-options:
  prepend-path: /usr/lib/sdk/dotnet9/bin
  append-ld-library-path: /usr/lib/sdk/dotnet9/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet9/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # The beta still reads the user's legally obtained Civilization II data and
  # writes saves beside it. This can be narrowed once the FOSS ruleset is whole.
  - --filesystem=home

modules:
  - name: dotnet-runtime
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet9/bin/install.sh

  - name: rhyciv
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
      - nuget-sources.json
    build-commands:
      - >-
        dotnet publish RaylibUI/RaylibUI.csproj -c Release
        -r linux-x64 --no-self-contained --source ./nuget-sources
        -p:UseAppHost=false
        -p:ContinuousIntegrationBuild=true
      - install -d /app/lib/rhyciv /app/bin
      - cp -a RaylibUI/bin/Release/net9.0/linux-x64/publish/. /app/lib/rhyciv/
      - install -Dm755 packaging/flatpak/rhyciv.sh /app/bin/rhyciv
      - install -Dm644 packaging/flatpak/io.github.crhy.rhYciv.desktop /app/share/applications/io.github.crhy.rhYciv.desktop
      - install -Dm644 packaging/flatpak/io.github.crhy.rhYciv.metainfo.xml /app/share/metainfo/io.github.crhy.rhYciv.metainfo.xml
      - install -d /app/share/icons/hicolor/512x512/apps
      - >-
        ffmpeg -hide_banner -loglevel error -y
        -i RaylibUI/FOSSart/rhyciv-app-icon.png
        -vf scale=512:512:flags=lanczos
        /app/share/icons/hicolor/512x512/apps/io.github.crhy.rhYciv.png
